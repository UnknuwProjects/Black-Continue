# Looks things up in the recompiled game code, which only exists on a runner (generated/ is gitignored and made from
# default.xbe). Run by hand: Actions, Analyze, Run workflow. It recompiles (no Gradle, no NDK) and prints the callers
# of one function: each caller's body and the functions it calls. A few hundred lines, nothing more, in the job log
# and in analysis.txt. The generated code itself is never uploaded: it is derived from the game.
#
# Secret: XBE_KEY, the same one build.yml uses.
name: Analyze

on:
  workflow_dispatch:
    inputs:
      target:
        description: "function to find the callers of"
        default: "sub_001E74B0"
        required: true

permissions:
  contents: read

jobs:
  analyze:
    runs-on: windows-2025
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v5

      - name: Decrypt default.xbe
        shell: bash
        env:
          XBE_KEY: ${{ secrets.XBE_KEY }}
        run: |
          if [ -z "$XBE_KEY" ]; then echo "::error::The XBE_KEY secret is missing"; exit 1; fi
          mkdir -p assets
          # through a file: Git Bash rewrites an environment value that looks like a path before openssl sees it
          key="$RUNNER_TEMP/xbe.key"
          printf '%s' "$XBE_KEY" > "$key"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in ci/default.xbe.enc -out assets/default.xbe -pass "file:$key"
          rm -f "$key"
          sha1sum assets/default.xbe

      # the same steps as build.bat's 3 and 4, without the Android part
      - name: Recompile
        shell: cmd
        run: |
          set "PF86=%ProgramFiles(x86)%"
          for /f "usebackq tokens=*" %%i in (`"%PF86%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSDIR=%%i"
          call "%VSDIR%\Common7\Tools\VsDevCmd.bat" -arch=amd64 -host_arch=amd64 >nul
          set "CLANGCL=%VSDIR%\VC\Tools\Llvm\x64\bin\clang-cl.exe"
          if not exist "%CLANGCL%" set "CLANGCL=C:\Program Files\LLVM\bin\clang-cl.exe"
          set "TOOLS=%CD%\out\build\android-tools"
          cmake -S tools -B "%TOOLS%" -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_C_COMPILER=%CLANGCL%" "-DCMAKE_CXX_COMPILER=%CLANGCL%"
          if errorlevel 1 exit /b 1
          cmake --build "%TOOLS%"
          if errorlevel 1 exit /b 1
          set /p SDK=<"%TOOLS%\sdk_dir.txt"
          set "SDK=%SDK:/=\%"
          findstr /b /l /c:"[symbols]" config\game.toml >nul 2>nul || "%TOOLS%\xbe_symbols.exe" assets\default.xbe "%SDK%\xdk" --out config\game.toml
          if errorlevel 1 exit /b 1
          "%TOOLS%\xbe_recomp.exe" config\game.toml --xdk "%SDK%\xdk" >nul
          if errorlevel 1 exit /b 1

      - name: Callers
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          cat > "$RUNNER_TEMP/find.py" <<'PY'
          import collections, pathlib, re, sys

          target = sys.argv[1]
          if not re.fullmatch(r"sub_[0-9A-Fa-f]{6,8}", target):
              sys.exit("not a function name: " + target)
          root = pathlib.Path("generated/game")
          # a definition starts at column 0 and names a sub_; a call is an indented line with the target in it
          start = re.compile(r"^[A-Za-z_][^;]*\b(sub_[0-9A-Fa-f]{6,8})\s*\(")
          call = re.compile(r"\bsub_[0-9A-Fa-f]{6,8}\b")
          out, shown = [], collections.OrderedDict()
          CAP, BODY = 600, 160

          def emit(text):
              out.append(text)

          for path in sorted(p for p in root.rglob("*") if p.suffix in (".cpp", ".h", ".inc", ".c")):
              lines = path.read_text(errors="replace").split("\n")
              starts = [i for i, l in enumerate(lines) if l and not l[0].isspace() and start.match(l)]
              for i, l in enumerate(lines):
                  if not l[:1].isspace() or target not in l:
                      continue
                  first = max([s for s in starts if s <= i], default=None)
                  if first is None:
                      emit(f"== {path.name}:{i + 1} (no function found)")
                      emit("\n".join(lines[max(0, i - 30):i + 30]))
                      continue
                  last = min([s for s in starts if s > first], default=len(lines))
                  key = (path.name, first)
                  if key in shown:
                      shown[key].append(i + 1)
                      continue
                  shown[key] = [i + 1]
                  name = start.match(lines[first]).group(1)
                  body = lines[first:last]
                  emit(f"== {name} in {path.name}:{first + 1}, {len(body)} lines, calls {target} at line {i + 1}")
                  if len(body) <= BODY:
                      emit("\n".join(body))
                  else:
                      emit(f"(long: the 60 lines round the call)")
                      emit("\n".join(lines[max(first, i - 30):min(last, i + 30)]))
                  callees = collections.Counter(c for c in call.findall("\n".join(body)) if c not in (name, target))
                  emit("-- calls: " + " ".join(f"{c}x{n}" if n > 1 else c for c, n in sorted(callees.items())))
          emit("")
          emit(f"{len(shown)} functions call {target}: " + ", ".join(f"{n}:{p}" for (n, _), p in shown.items()))
          text = "\n".join(out).split("\n")
          if len(text) > CAP:
              text = text[:CAP] + [f"... cut at {CAP} lines"]
          result = "\n".join(text)
          pathlib.Path("analysis.txt").write_text(result)
          print(result)
          PY
          python -I "$RUNNER_TEMP/find.py" "$TARGET"

      - uses: actions/upload-artifact@v5
        with:
          name: analysis
          path: analysis.txt
          retention-days: 3
          if-no-files-found: error
