# Looks things up in the recompiled game code, which only exists on a runner (generated/ is gitignored and made from
# default.xbe). Run by hand: Actions, Analyze, Run workflow. It recompiles (no Gradle, no NDK) and prints, for each
# target, the function's body and what it calls (with how many places call each of those, and how long each is). A few
# hundred lines, nothing more, in the job log and in analysis.txt. The generated code itself is never uploaded: it is
# derived from the game.
#
# A target is sub_XXXXXXXX (the functions that call it, found by name) or 0xXXXXXX (the function that holds the
# address, found from the function table). Several apart by spaces. text:WORDS finds a text in default.xbe (ASCII or
# UTF-16, any case, _ is a space) and the code lines that use its address.
#
# Secret: XBE_KEY, the same one build.yml uses.
name: Analyze

on:
  workflow_dispatch:
    inputs:
      target:
        description: "0xXXXXXX (function holding it), sub_XXXXXXXX (functions calling it), @sub_XXXXXXXX (its call sites), text:WORDS (a text and who uses it); :N lines"
        default: "@sub_001DAFF0:22"
        required: true

permissions:
  contents: read

jobs:
  analyze:
    runs-on: windows-2025
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v5

      - name: Decrypt default.xbe
        shell: bash
        env:
          XBE_KEY: ${{ secrets.XBE_KEY }}
        run: |
          if [ -z "$XBE_KEY" ]; then echo "::error::The XBE_KEY secret is missing"; exit 1; fi
          mkdir -p assets
          # through a file: Git Bash rewrites an environment value that looks like a path before openssl sees it
          key="$RUNNER_TEMP/xbe.key"
          printf '%s' "$XBE_KEY" > "$key"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in ci/default.xbe.enc -out assets/default.xbe -pass "file:$key"
          rm -f "$key"
          sha1sum assets/default.xbe

      # the same steps as build.bat's 3 and 4, without the Android part
      - name: Recompile
        shell: cmd
        run: |
          set "PF86=%ProgramFiles(x86)%"
          for /f "usebackq tokens=*" %%i in (`"%PF86%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSDIR=%%i"
          call "%VSDIR%\Common7\Tools\VsDevCmd.bat" -arch=amd64 -host_arch=amd64 >nul
          set "CLANGCL=%VSDIR%\VC\Tools\Llvm\x64\bin\clang-cl.exe"
          if not exist "%CLANGCL%" set "CLANGCL=C:\Program Files\LLVM\bin\clang-cl.exe"
          set "TOOLS=%CD%\out\build\android-tools"
          cmake -S tools -B "%TOOLS%" -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_C_COMPILER=%CLANGCL%" "-DCMAKE_CXX_COMPILER=%CLANGCL%"
          if errorlevel 1 exit /b 1
          cmake --build "%TOOLS%"
          if errorlevel 1 exit /b 1
          set /p SDK=<"%TOOLS%\sdk_dir.txt"
          set "SDK=%SDK:/=\%"
          findstr /b /l /c:"[symbols]" config\game.toml >nul 2>nul || "%TOOLS%\xbe_symbols.exe" assets\default.xbe "%SDK%\xdk" --out config\game.toml
          if errorlevel 1 exit /b 1
          "%TOOLS%\xbe_recomp.exe" config\game.toml --xdk "%SDK%\xdk" >nul
          if errorlevel 1 exit /b 1

      - name: Look up
        shell: bash
        env:
          TARGETS: ${{ inputs.target }}
        run: |
          cat > "$RUNNER_TEMP/find.py" <<'PY'
          import bisect, collections, pathlib, re, sys

          targets, lines_for = [], {}
          for t in sys.argv[1].replace(",", " ").split():
              m = re.fullmatch(r"(@?sub_[0-9A-Fa-f]{6,8}|0x[0-9A-Fa-f]{1,8}|text:[^\s,]{3,60})(?::(\d{1,4}))?", t)
              if not m:
                  sys.exit("not a function name or an address: " + t)
              targets.append(m.group(1))
              if m.group(2):
                  lines_for[m.group(1)] = int(m.group(2))
          root = pathlib.Path("generated/game")
          TABLE = "x86_func_mapping.cpp"  # every function's address and name: not a caller of anything
          # a definition is X86_FUNC(__imp__sub_XXXXXXXX) at column 0; a call is an indented line with a sub_ in it
          start = re.compile(r"^X86_FUNC\(__imp__(sub_[0-9A-Fa-f]{6,8})\)")
          call = re.compile(r"\bsub_[0-9A-Fa-f]{6,8}\b")
          BODY, CAP, CALLEES = 30, 1200, 70

          defs = {}  # name: (path, first, last)
          files = {}
          called = collections.Counter()  # in how many lines each function is called
          for path in sorted(p for p in root.rglob("*") if p.suffix in (".cpp", ".h", ".inc", ".c")):
              if path.name == TABLE:
                  continue
              lines = path.read_text(errors="replace").split("\n")
              files[path] = lines
              starts = [i for i, l in enumerate(lines) if l and not l[0].isspace() and start.match(l)]
              for k, s in enumerate(starts):
                  defs.setdefault(start.match(lines[s]).group(1), (path, s, starts[k + 1] if k + 1 < len(starts) else len(lines)))
              for l in lines:
                  if l[:1].isspace():
                      for c in set(call.findall(l)):
                          called[c] += 1

          table = sorted((int(a, 16), n) for a, n in re.findall(
              r"\{0x([0-9A-Fa-f]+)u,\s*(sub_[0-9A-Fa-f]+)\}", (root / TABLE).read_text(errors="replace")))
          out = []

          def show(name, why, body=BODY):
              if name not in defs:
                  # not written the way the search expects: where the name is, and the first places as they are
                  places = [(p, i) for p, ls in files.items() for i, l in enumerate(ls) if name in l]
                  out.append(f"== {name}: {why}: no definition of the usual form, {len(places)} lines have the name: " +
                             " ".join(f"{p.name}:{i + 1}" for p, i in places[:15]))
                  for p, i in places[:3]:
                      out.append(f"-- {p.name}:{i + 1}")
                      out.extend(files[p][max(0, i - 2):i + 60])
                  return
              path, first, last = defs[name]
              lines = files[path][first:last]
              out.append(f"== {name} in {path.name}:{first + 1}, {len(lines)} lines, called in {called[name]} places: {why}")
              out.extend(lines[:body])
              if len(lines) > body:
                  out.append(f"... {len(lines) - body} more lines")
              callees = collections.Counter(c for c in call.findall("\n".join(lines)) if c != name)
              out.append("-- calls (name, times here, places that call it, its lines):")
              for c, n in sorted(callees.items(), key=lambda x: -called[x[0]])[:CALLEES]:
                  size = defs[c][2] - defs[c][1] if c in defs else 0
                  out.append(f"   {c} x{n}, {called[c]} places, {size} lines")

          # text:WORDS. The XBE's sections say where each byte of the file sits in memory; the code names an address as
          # 0xXXXXXXXX in its instruction comments, so a string's address finds the lines that use it
          def xbe_data():
              d = pathlib.Path("assets/default.xbe").read_bytes()
              u32 = lambda o: int.from_bytes(d[o:o + 4], "little")
              table = u32(0x120) - u32(0x104)
              # virtual address, file offset, size of each section
              return d, [(u32(table + i * 0x38 + 4), u32(table + i * 0x38 + 12), u32(table + i * 0x38 + 16))
                         for i in range(u32(0x11C))]

          def find_text(word, limit=6):
              d, secs = xbe_data()
              low, found = d.lower(), {}  # start address: (text, kind)
              for kind, needle in (("ascii", word.lower().encode()), ("utf16", word.lower().encode("utf-16-le"))):
                  at = low.find(needle)
                  while at >= 0 and len(found) < limit:
                      s = at
                      if kind == "ascii":
                          while s > 0 and at - s < 300 and d[s - 1] != 0:
                              s -= 1
                          e = d.find(b"\0", at)
                          text = d[s:e].decode("latin-1")
                      else:
                          while s >= 2 and at - s < 600 and d[s - 2:s] != b"\0\0":
                              s -= 2
                          e = at
                          while e + 2 <= len(d) and d[e:e + 2] != b"\0\0" and e - s < 600:
                              e += 2
                          text = d[s:e].decode("utf-16-le", errors="replace")
                      for va, raw, size in secs:
                          if raw <= s < raw + size:
                              found.setdefault(va + s - raw, (text[:100], kind))
                              break
                      at = low.find(needle, at + len(needle))
              return found

          def users(addresses):
              wanted = {f"0x{a:08X}": a for a in addresses}
              seen = collections.defaultdict(list)  # address: (function, file, line, instruction)
              pat = re.compile(r"0x[0-9A-F]{8}")
              for path, lines in files.items():
                  starts = [i for i, l in enumerate(lines) if l and not l[0].isspace() and start.match(l)]
                  for i, l in enumerate(lines):
                      if not l.startswith("\t// "):
                          continue
                      for h in pat.findall(l):
                          if h in wanted:
                              k = bisect.bisect_right(starts, i) - 1
                              holder = start.match(lines[starts[k]]).group(1) if k >= 0 else "?"
                              seen[wanted[h]].append((holder, path.name, i + 1, l.strip()))
              return seen

          for t in targets:
              if t.startswith("text:"):
                  found = find_text(t[5:].replace("_", " "))
                  out.append(f"## {t}: {len(found)} strings in default.xbe")
                  if not found:
                      continue
                  seen = users(found)
                  for a, (text, kind) in sorted(found.items()):
                      sites = seen.get(a, [])
                      out.append(f"-- 0x{a:08X} {kind} \"{text}\": {len(sites)} code lines name it")
                      for holder, pname, n, ins in sites[:8]:
                          out.append(f"   in {holder} ({pname}:{n}): {ins}")
                      if len(sites) > 8:
                          out.append(f"   ... {len(sites) - 8} more")
                  continue
              if t.startswith("@"):
                  # the places that call it, as the last instructions before each call (the pushed arguments show)
                  name, keep, sites = t[1:], lines_for.get(t, 24), []
                  for path, lines in files.items():
                      starts = [i for i, l in enumerate(lines) if l and not l[0].isspace() and start.match(l)]
                      for i, l in enumerate(lines):
                          if l[:1].isspace() and re.search(r"\b" + name + r"\(ctx", l):
                              first = max([s for s in starts if s <= i], default=None)
                              holder = start.match(lines[first]).group(1) if first is not None else "?"
                              ins = [x.strip() for x in lines[max(0, i - 80):i] if x.startswith("\t// ")]
                              sites.append((holder, path.name, i + 1, ins[-keep:]))
                  out.append(f"## {t}: {len(sites)} call sites")
                  for holder, pname, n, ins in sites:
                      out.append(f"-- in {holder} ({pname}:{n})")
                      out.extend("   " + x for x in ins)
                  continue
              if t.startswith("0x"):
                  address = int(t, 16)
                  before = [e for e in table if e[0] <= address]
                  if not before:
                      out.append(f"== {t}: no function starts before it")
                      continue
                  # the last starts: a piece of a function can have a name of its own
                  out.append(f"## {t}: the starts just before it: " + " ".join(f"{a:#X}={n}" for a, n in before[-3:]))
                  show(before[-1][1], f"holds {t}", lines_for.get(t, BODY))
              else:
                  hits = collections.OrderedDict()
                  for path, lines in files.items():
                      starts = [i for i, l in enumerate(lines) if l and not l[0].isspace() and start.match(l)]
                      for i, l in enumerate(lines):
                          if l[:1].isspace() and t in l:
                              first = max([s for s in starts if s <= i], default=None)
                              if first is not None:
                                  hits.setdefault(start.match(lines[first]).group(1), i + 1)
                  out.append(f"## {t}: {len(hits)} functions call it: " + " ".join(hits))
                  for name in hits:
                      show(name, f"calls {t}", lines_for.get(t, BODY))
          text = out if len(out) <= CAP else out[:CAP] + [f"... cut at {CAP} lines"]
          result = "\n".join(text)
          pathlib.Path("analysis.txt").write_text(result)
          print(result)
          PY
          python -I "$RUNNER_TEMP/find.py" "$TARGETS"

      - uses: actions/upload-artifact@v5
        with:
          name: analysis
          path: analysis.txt
          retention-days: 3
          if-no-files-found: error
