# Recompiles default.xbe only (no Gradle) and dumps the checkpoint message code (callers, bodies, users of its globals).
# Put this file at .github/workflows/callers-dump.yml (replace the old content). Manual run: Actions > Callers dump > Run workflow.
name: Callers dump

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Functions whose call sites to list, space separated"
        default: "sub_0020CE00 sub_0020CD50 sub_001B79D0 sub_001DEC70"
      functions:
        description: "Functions whose whole body to print, space separated"
        default: "sub_0020CE00 sub_0020CD50 sub_001B79D0"
      globals:
        description: "Data addresses (8 hex digits) whose users to list, space separated"
        default: ""
      both:
        description: "Instruction patterns separated by |, lists functions that contain all of them"
        default: ""
      both2:
        description: "Same, second set"
        default: ""
      both3:
        description: "Same, third set"
        default: ""

jobs:
  grep:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      NDK_VERSION: 28.2.13676358
      CMAKE_VERSION: 3.31.6

    steps:
      - uses: actions/checkout@v5

      - name: Android SDK packages
        shell: cmd
        run: call "%ANDROID_HOME%\cmdline-tools\latest\bin\sdkmanager.bat" --install "platforms;android-34" "ndk;%NDK_VERSION%" "cmake;%CMAKE_VERSION%" >nul

      - name: Decrypt default.xbe
        shell: bash
        env:
          XBE_KEY: ${{ secrets.XBE_KEY }}
        run: |
          if [ -z "$XBE_KEY" ]; then echo "::error::The XBE_KEY secret is missing"; exit 1; fi
          mkdir -p assets
          key="$RUNNER_TEMP/xbe.key"
          printf '%s' "$XBE_KEY" > "$key"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in ci/default.xbe.enc -out assets/default.xbe -pass "file:$key"
          rm -f "$key"
          sha1sum assets/default.xbe

      - name: Recompile
        shell: cmd
        run: |
          set "PF86=%ProgramFiles(x86)%"
          set "VSWHERE=%PF86%\Microsoft Visual Studio\Installer\vswhere.exe"
          set "TOOLS=%CD%\out\build\android-tools"
          set "NDK=%ANDROID_HOME%\ndk\%NDK_VERSION%"
          set "SDKCMAKE=%ANDROID_HOME%\cmake\%CMAKE_VERSION%\bin"
          for /f "usebackq tokens=*" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSDIR=%%i"
          if not defined VSDIR (echo Visual Studio not found & exit /b 1)
          call "%VSDIR%\Common7\Tools\VsDevCmd.bat" -arch=amd64 -host_arch=amd64 >nul
          set "PATH=%SDKCMAKE%;%PATH%"
          set "CLANGCL=%VSDIR%\VC\Tools\Llvm\x64\bin\clang-cl.exe"
          if not exist "%CLANGCL%" set "CLANGCL=%NDK%\toolchains\llvm\prebuilt\windows-x86_64\bin\clang-cl.exe"
          cmake -S tools -B "%TOOLS%" -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_C_COMPILER=%CLANGCL%" "-DCMAKE_CXX_COMPILER=%CLANGCL%" >nul || exit /b 1
          cmake --build "%TOOLS%" >nul || exit /b 1
          set /p SDK=<"%TOOLS%\sdk_dir.txt"
          set "SDK=%SDK:/=\%"
          findstr /b /l /c:"[symbols]" config\game.toml >nul 2>nul && goto recompile
          "%TOOLS%\xbe_symbols.exe" assets\default.xbe "%SDK%\xdk" --out config\game.toml || exit /b 1
          :recompile
          "%TOOLS%\xbe_recomp.exe" config\game.toml --xdk "%SDK%\xdk" >nul || exit /b 1

      - name: Dump
        shell: bash
        env:
          TARGETS: ${{ inputs.targets }}
          FUNCTIONS: ${{ inputs.functions }}
          GLOBALS: ${{ inputs.globals }}
          BOTH: ${{ inputs.both }}
          BOTH2: ${{ inputs.both2 }}
          BOTH3: ${{ inputs.both3 }}
        run: |
          set +e +o pipefail
          echo "VERSION 8: bodies, callers, globals, pattern sets" > out.txt
          for T in $TARGETS; do
            {
              echo
              echo "######## callers of $T (file:line function | the 4 instructions before the call and the call)"
              awk -v tgt="$T" '
                /^X86_FUNC\(__imp__/ { fn = $0; sub(/^X86_FUNC\(__imp__/, "", fn); sub(/\).*/, "", fn) }
                /^\t\/\/ / { l = $0; sub(/^\t\/\/ /, "", l); n++; r[n % 5] = l }
                index($0, tgt "(ctx, base)") {
                  s = ""
                  for (i = n - 4; i <= n; i++) if (i > 0) s = s " ; " r[i % 5]
                  f = FILENAME; sub(/.*x86_recomp\./, "", f)
                  print f ":" FNR " " fn " |" s
                }' generated/game/x86_recomp.*.cpp
            } >> out.txt
          done
          for F in $FUNCTIONS; do
            {
              echo
              echo "######## body of $F (instruction comments and labels)"
              awk -v name="$F" '
                $0 ~ "^X86_FUNC\\(__imp__" name "\\)" { on = 1; f = FILENAME; sub(/.*x86_recomp\./, "", f); print "file " f " line " FNR }
                on && (/^\t\/\/ / || /^loc_/) { l = $0; sub(/^\t\/\/ /, "", l); print l }
                $0 ~ "^X86_WEAK_FUNC\\(" name "," { on = 0 }
              ' generated/game/x86_recomp.*.cpp
            } >> out.txt
          done
          for G in $GLOBALS; do
            {
              echo
              echo "######## users of 0x$G (function | instruction)"
              awk -v g="$G" '
                /^X86_FUNC\(__imp__/ { fn = $0; sub(/^X86_FUNC\(__imp__/, "", fn); sub(/\).*/, "", fn) }
                /^\t\/\/ / && index($0, "0x" g) { l = $0; sub(/^\t\/\/ /, "", l); print fn " | " l }
              ' generated/game/x86_recomp.*.cpp
            } >> out.txt
          done
          for SET in "$BOTH" "$BOTH2" "$BOTH3"; do
            [ -z "$SET" ] && continue
            {
              echo
              echo "######## functions containing all of: $SET (function, then the matching instructions)"
              awk -v pats="$SET" '
                BEGIN { np = split(pats, P, "|") }
                function flush(   i, ok) {
                  ok = 1
                  for (i = 1; i <= np; i++) if (!hit[i]) ok = 0
                  if (ok && np > 0 && fn != "") { print "== " fn; printf "%s", buf }
                  for (i = 1; i <= np; i++) hit[i] = 0
                  buf = ""
                }
                /^X86_FUNC\(__imp__/ { flush(); fn = $0; sub(/^X86_FUNC\(__imp__/, "", fn); sub(/\).*/, "", fn) }
                /^\t\/\/ / {
                  l = $0; sub(/^\t\/\/ /, "", l)
                  for (i = 1; i <= np; i++) if (index(l, P[i])) { hit[i] = 1; buf = buf "  " l "\n"; break }
                }
                END { flush() }
              ' generated/game/x86_recomp.*.cpp
            } >> out.txt
          done
          wc -l out.txt
          head -c 60000 out.txt

      - uses: actions/upload-artifact@v5
        with:
          name: callers-v8
          path: out.txt
