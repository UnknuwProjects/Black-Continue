# Builds the APK and publishes a release for each v* tag. The recompiler needs default.xbe: ci/default.xbe.enc,
# decrypted with the XBE_KEY secret.
#
# Secrets: XBE_KEY (the passphrase of ci/default.xbe.enc), KEYSTORE_BASE64 (the release .jks in base64),
# KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD. Without the keystore the APK has a debug signature.
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 300
    env:
      NDK_VERSION: 28.2.13676358
      CMAKE_VERSION: 3.31.6

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the tags and commits, for the list of changes since the previous release

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK packages
        shell: cmd
        run: call "%ANDROID_HOME%\cmdline-tools\latest\bin\sdkmanager.bat" --install "platforms;android-34" "ndk;%NDK_VERSION%" "cmake;%CMAKE_VERSION%" >nul

      - name: Decrypt default.xbe
        shell: bash
        env:
          XBE_KEY: ${{ secrets.XBE_KEY }}
        run: |
          if [ -z "$XBE_KEY" ]; then echo "::error::The XBE_KEY secret is missing"; exit 1; fi
          mkdir -p assets
          # through a file: Git Bash rewrites an environment value that looks like a path (the key may start with /)
          # before a Windows program such as openssl sees it
          key="$RUNNER_TEMP/xbe.key"
          printf '%s' "$XBE_KEY" > "$key"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in ci/default.xbe.enc -out assets/default.xbe -pass "file:$key"
          rm -f "$key"
          sha1sum assets/default.xbe

      - name: Decrypt sources
        shell: bash
        env:
          SRC_KEY: ${{ secrets.SRC_KEY }}
        run: |
          set -euo pipefail
          # every *.enc under src/ becomes the file without .enc (hooks.cpp.enc -> hooks.cpp)
          mapfile -d '' files < <(find src -type f -name '*.enc' -print0)
          if [ "${#files[@]}" -eq 0 ]; then echo "No encrypted sources found, skipping"; exit 0; fi
          if [ -z "$SRC_KEY" ]; then echo "::error::The SRC_KEY secret is missing"; exit 1; fi
          key="$RUNNER_TEMP/src.key"
          printf '%s' "$SRC_KEY" > "$key"
          for f in "${files[@]}"; do
            echo "Decrypting $f"
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -in "$f" -out "${f%.enc}" -pass "file:$key"
          done
          rm -f "$key"

      - name: Release key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::warning::No release keystore: the APK has a debug signature"; exit 0; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "BLACK_KEYSTORE=$RUNNER_TEMP/release.jks"
            echo "BLACK_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "BLACK_KEY_ALIAS=$KEY_ALIAS"
            echo "BLACK_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Version
        id: version
        shell: bash
        run: |
          name="${GITHUB_REF_NAME#v}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "GRADLE_ARGS=-PversionCode=${{ github.run_number }} -PversionName=$name" >> "$GITHUB_ENV"

      - name: Build
        shell: cmd
        run: call build.bat

      - name: Name the APK
        shell: bash
        run: mv app/build/outputs/apk/release/app-release.apk "Black-${{ steps.version.outputs.name }}.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: Black-${{ steps.version.outputs.name }}
          path: Black-${{ steps.version.outputs.name }}.apk
          if-no-files-found: error

      - name: Changelog
        shell: bash
        run: |
          # Previous release tag (the tag being built is excluded). Without one, every commit is listed.
          prev=$(git describe --tags --abbrev=0 --match 'v*' --exclude "$GITHUB_REF_NAME" HEAD 2>/dev/null || true)
          if [ -n "$prev" ]; then range="$prev..HEAD"; else range="HEAD"; fi
          echo "Changes in $range"

          subjects="$RUNNER_TEMP/subjects.txt"
          git log "$range" --no-merges --pretty=format:'%s' | tr -d '\r' > "$subjects"
          echo >> "$subjects"

          # emit <heading> <type regex>: bullets for the commits like "type: text" or "type(scope): text"
          emit() {
            local items
            items=$(grep -E "^($2)(\([^)]*\))?!?: " "$subjects" \
              | sed -E 's/^[a-z0-9]+(\([^)]*\))?!?: //' \
              | awk '{ print "* " toupper(substr($0,1,1)) substr($0,2) }' || true)
            if [ -n "$items" ]; then printf '**%s**\n\n%s\n\n' "$1" "$items"; fi
          }

          {
            emit "New"          'feat'
            emit "Fixes"        'fix'
            emit "Improvements" 'perf|refactor|ui'
            emit "Translations" 'i18n|l10n'
            # commits without any "type:" prefix
            other=$(grep -vE '^[a-z0-9]+(\([^)]*\))?!?: ' "$subjects" | grep -v '^$' \
              | awk '{ print "* " toupper(substr($0,1,1)) substr($0,2) }' || true)
            if [ -n "$other" ]; then printf '**Other**\n\n%s\n\n' "$other"; fi
          } > "$RUNNER_TEMP/changes.md"

          if [ ! -s "$RUNNER_TEMP/changes.md" ]; then echo "* Internal fixes and improvements." > "$RUNNER_TEMP/changes.md"; fi
          cat "$RUNNER_TEMP/changes.md"

      - name: Release notes
        shell: bash
        env:
          CHANGES_FILE: ${{ runner.temp }}/changes.md
        run: |
          apk="Black-${{ steps.version.outputs.name }}.apk"
          size=$(awk -v b="$(stat -c %s "$apk")" 'BEGIN { printf "%.1f MB", b / 1048576 }')
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          # put the changelog in place of {{CHANGES}}, then fill in the other placeholders
          awk 'index($0, "{{CHANGES}}") { f = ENVIRON["CHANGES_FILE"]; while ((getline l < f) > 0) print l; close(f); next } { print }' \
              ci/release-notes.md > "$RUNNER_TEMP/notes-stage.md"
          sed -e "s|{{VERSION}}|$GITHUB_REF_NAME|g" -e "s|{{TAG}}|$GITHUB_REF_NAME|g" -e "s|{{APK}}|$apk|g" \
              -e "s|{{SIZE}}|$size|g" -e "s|{{SHA256}}|$sha|g" "$RUNNER_TEMP/notes-stage.md" > "$RUNNER_TEMP/release-notes.md"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: Black for Android ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: Black-${{ steps.version.outputs.name }}.apk
          generate_release_notes: false
          make_latest: true
